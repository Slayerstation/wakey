name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and Test Application
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential

      - name: Compile Application
        run: |
          echo "Compiling application from src/..."
          # Adjust compiler flags as needed.
          gcc src/*.c -I include -o wakey_app
          echo "Compiled executable:"
          ls -l wakey_app

      - name: Run Application Tests
        run: |
          echo "Locating C test files under tests/..."
          # Find and run every C test file.
          for test_file in $(find tests -type f -name "*.c"); do
              echo "Processing test: $test_file"
              # Remove .c suffix to generate an executable name.
              test_exe="${test_file%.c}"
              gcc "$test_file" -I include -o "$test_exe"
              echo "Running test executable: $test_exe"
              ./"$test_exe"
          done

  docker-build:
    name: Build Docker Images
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Build Docker Images
        run: |
          echo "Searching for Dockerfiles..."
          # Find Dockerfiles in the repository root matching 'Dockerfile*'
          for dockerfile in $(find . -maxdepth 1 -type f -name 'Dockerfile*'); do
              # Use the Dockerfile name (in lowercase) as the image name
              image_name=$(basename "$dockerfile" | tr '[:upper:]' '[:lower:]')
              echo "Building Docker image for $dockerfile as ${image_name}:latest"
              docker build -f "$dockerfile" -t "${image_name}:latest" .
          done
